<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="630" viewBox="0 0 1600 630"><rect width="1600" height="630" fill="#ffffff"/><rect x="20" y="40" width="290" height="300" fill="#ffffff" stroke="#000" stroke-width="2.5"/><text x="40" y="85" font-family="Times New Roman" font-size="32" font-weight="bold">Source table</text><text x="40" y="130" font-family="Courier New" font-size="26">resep_obat:</text><text x="40" y="167" font-family="Courier New" font-size="26">no_resep</text><text x="40" y="204" font-family="Courier New" font-size="26">no_rawat</text><text x="40" y="241" font-family="Courier New" font-size="26">kd_dokter</text><text x="40" y="278" font-family="Courier New" font-size="26">tgl_peresepan</text><text x="40" y="315" font-family="Courier New" font-size="26">status ...</text><rect x="380" y="40" width="330" height="300" fill="#eeeeee" stroke="#000" stroke-width="2.5"/><text x="400" y="85" font-family="Times New Roman" font-size="32" font-weight="bold">Stage 1 (LLM)</text><text x="400" y="130" font-family="Times New Roman" font-size="30">select 1–3 FHIR</text><text x="400" y="168" font-family="Times New Roman" font-size="30">resources, ranked</text><rect x="400" y="195" width="290" height="125" fill="#ffffff" stroke="#000" stroke-width="2.5"/><text x="415" y="235" font-family="Times New Roman" font-size="26" font-style="italic">catalogue: official</text><text x="415" y="270" font-family="Times New Roman" font-size="26" font-style="italic">definition of the</text><text x="415" y="305" font-family="Times New Roman" font-size="26" font-style="italic">11 resources</text><rect x="780" y="40" width="300" height="300" fill="#ffffff" stroke="#000" stroke-width="2.5"/><text x="800" y="85" font-family="Times New Roman" font-size="32" font-weight="bold">Ranked resources</text><rect x="790" y="112" width="282" height="42" fill="none" stroke="#000" stroke-width="2.5" stroke-dasharray="6 5"/><text x="800" y="142" font-family="Times New Roman" font-size="30">1. MedicationRequest</text><text x="800" y="192" font-family="Times New Roman" font-size="30">2. Encounter</text><text x="800" y="242" font-family="Times New Roman" font-size="30">3. ServiceRequest</text><rect x="1150" y="40" width="430" height="300" fill="#eeeeee" stroke="#000" stroke-width="2.5"/><text x="1170" y="85" font-family="Times New Roman" font-size="32" font-weight="bold">Stage 2 (LLM), primary</text><text x="1170" y="130" font-family="Times New Roman" font-size="30">match all columns against</text><text x="1170" y="168" font-family="Times New Roman" font-size="30">the rank-1 resource only</text><text x="1170" y="220" font-family="Courier New" font-size="26">no_resep → identifier</text><text x="1170" y="255" font-family="Courier New" font-size="26">no_rawat → encounter</text><text x="1170" y="290" font-family="Courier New" font-size="26">kd_dokter → requester</text><text x="1170" y="325" font-family="Courier New" font-size="26">tgl_peresepan → authoredOn</text><line x1="310" y1="190" x2="360.0" y2="190.0" stroke="#000" stroke-width="2.5"/><polygon points="378.0,190.0 360.0,181.0 360.0,199.0" fill="#000"/><line x1="710" y1="190" x2="760.0" y2="190.0" stroke="#000" stroke-width="2.5"/><polygon points="778.0,190.0 760.0,181.0 760.0,199.0" fill="#000"/><line x1="1072" y1="133" x2="1130.0" y2="133.0" stroke="#000" stroke-width="2.5"/><polygon points="1148.0,133.0 1130.0,124.0 1130.0,142.0" fill="#000"/><rect x="20" y="420" width="760" height="190" fill="#ffffff" stroke="#000" stroke-width="2.5"/><text x="40" y="465" font-family="Times New Roman" font-size="32" font-weight="bold">Baseline llm-full</text><text x="40" y="510" font-family="Times New Roman" font-size="30">one prompt: all source columns × all 289</text><text x="40" y="548" font-family="Times New Roman" font-size="30">elements of the 11 resources</text><text x="40" y="586" font-family="Times New Roman" font-size="30">(no resource selection)</text><rect x="820" y="420" width="760" height="190" fill="#ffffff" stroke="#000" stroke-width="2.5"/><text x="840" y="465" font-family="Times New Roman" font-size="32" font-weight="bold">Variant union</text><text x="840" y="510" font-family="Times New Roman" font-size="30">stage 2 matches against the union of all</text><text x="840" y="548" font-family="Times New Roman" font-size="30">selected resources; referenced resources</text><text x="840" y="586" font-family="Times New Roman" font-size="30">(e.g. Encounter) absorb predictions</text><line x1="165" y1="340" x2="284.4" y2="409.0" stroke="#000" stroke-width="2.5" stroke-dasharray="10 8"/><polygon points="300.0,418.0 288.9,401.2 279.9,416.8" fill="#000"/><line x1="930" y1="340" x2="1034.9" y2="408.2" stroke="#000" stroke-width="2.5" stroke-dasharray="10 8"/><polygon points="1050.0,418.0 1039.8,400.6 1030.0,415.7" fill="#000"/></svg>
